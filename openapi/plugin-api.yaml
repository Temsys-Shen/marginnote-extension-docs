          description: App 名称。
        appVersion:
          type: string
          description: App 版本号。
        enabled:
          type: boolean
          description: Bridge 是否开着。
        authorized:
          type: boolean
          description: 本次请求是否带有效令牌。面板走进程内的路径，该项的意义有限。
        bridgeApiVersion:
          type: string
          description: Bridge 契约版本，也是本分组 `info.version` 的取值来源。
        routeCount:
          type: number
          description: MarginNote 注册的路由条数。
        apiFingerprint:
          type: string
          description: 路由目录的校验值。校验值不同即视为不同的契约，据此判断手上的清单是否仍然有效。
        guideVersion:
          type: string
          description: 运行规程的版本号。
        guideHash:
          type: string
          description: 运行规程正文的 SHA-256。版本号相同而哈希不同，说明正文改过，按哈希缓存才可靠。
        instanceNonce:
          type: string
          description: 本次运行的身份串，用于判断发现文件是否过期。
        guide:
