          description: 规程正文的哈希。
        route:
          type: string
        refreshPolicy:
          type: string
          description: MarginNote 建议的抓取时机。
        usesExistingBearer:
          type: boolean
        installRequired:
          type: boolean
        rotatesToken:
          type: boolean
    RouteDescriptor:
