x-mn-allowlist-source: 取自 output/doc/SDK路由参考_2026-09-21.md，该文件列出 123 条接口，其中 73 条在网页面板里放行
x-mn-example-recordings: 标为真机实录的响应样本录制于 2026-09-18，录制时 MarginNote bridgeApiVersion 为 0.61
x-mn-entry-point: 插件的入口是页面里的 `window.mn`，不是 HTTP 端口
security: []
tags:
  - name: 能力与状态
    description: 读 MarginNote 的能力、版本与当前上下文。调用其他接口之前先读该组。
  - name: 卡片与摘录
    description: 卡片的读取与写入、摘录的创建、批注、标签、元数据与留白。
  - name: 手写会话
    description: 手写层、作答纸、练习准备清单与会话记录的读取与提交。
  - name: 学习集与卡组
    description: 学习集结构、脑图树、子脑图、色板、快照与复习卡组。
  - name: 文档与页面
    description: 文档目录、页文本、页内注释面、摘录清单与同步诊断。
  - name: 查找
    description: 跨库搜索、文件夹列表与学习集列表。
  - name: 界面与模板
    description: 当前界面状态与沉浸模板的读取。
  - name: 任务包与同步诊断
    description: 拆书任务包与旧 CloudKit 同步诊断。
