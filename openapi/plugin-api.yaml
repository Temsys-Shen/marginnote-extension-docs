  /bundles:
    get:
      tags:
        - 任务包与同步诊断
      summary: 列出任务包
      operationId: getBundles
      description: |
        列出现存的拆书任务包，含运行中的作业与 App 重启后留在磁盘上的目录。

        条目的时间基准随类别不同。磁盘上的包按目录创建时间计，作业条目按作业
        开始时间计。因此运行中的长作业不会因为开始时间早于 `since` 而从增量轮询里消失，
        该条目的时间戳也不会随进度前进。

        带 `origin=bridge` 时只列由 Bridge 建立的包。该标记是包目录里的一个空文件。

        `state` 的取值如下。`preparing` 表示作业运行中，附带页数进度；`prepared` 与 `imported`
        表示包可用；`failed` 表示作业失败或 App 中途重启留下的残留，附带失败原因，用删除
        任务包清理；`cancelled` 表示包已取消。只认 `prepared` 与 `imported` 的写法要改成
        把其余各档一律当作不可用。

        `version` 与 `rootNoteId` 只出现在 `prepared` 与 `imported` 的条目上，`progress`
        只出现在 `preparing` 的条目上，`running` 只出现在作业条目上。缺少时按没有该项处理，不得当作空值。

        `jobId` 说明不了作业所属的会话。经 prepare 登记的包都有该字段，App 重启后由磁盘标记
        回带的包也有，判断作业是否属于本轮要看 `state`。

        响应里不含标题、预设与来源。
      x-mn-source:
        - output/doc/mn-bridge-规程_v0.91_2026-10-06.md:1312-1323
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Since'
      responses:
