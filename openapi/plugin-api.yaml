      properties:
        bridgeApiVersion:
          type: string
        routeCount:
          type: number
        apiFingerprint:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteDescriptor'
        presets:
          type: array
          items:
            type: string
          description: 拆书任务包可用的预设。
        anchorModes:
          type: array
          items:
            type: string
          description: 拆书任务包可用的定位方式。
        guideVersion:
          type: string
        guideHash:
          type: string
        guide:
          $ref: '#/components/schemas/GuideInfo'
      additionalProperties: true
    UiStateResponse:
      type: object
      description: 当前界面状态。`state` 里的键随 MarginNote 的版本增减，读自己认识的键即可。
      properties:
        bridgeApiVersion:
          type: string
