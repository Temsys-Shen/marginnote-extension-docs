        expectedTopicId:
          type: string
        requestId:
          type: string
        expectedRevision:
          type: integer
          description: 读到的版本号，取值 0 到 256。与 `POST /writing/plan-read` 响应里的 `plan.revision` 对照。
        questions:
          type: array
          maxItems: 20
          description: 本次准备作答的题目。传空数组表示清空准备选择，不会删掉题目或笔迹。
          items:
            type: object
            required:
              - questionId
              - carrier
            properties:
              questionId:
                type: string
              carrier:
                type: string
                enum:
                  - blank
                  - focus
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingResolveRequest:
      type: object
      required:
        - topicid
        - questionId
      properties:
        topicid:
          type: string
        questionId:
          type: string
    WritingSessionPreviewRequest:
      type: object
      required:
        - runId
        - attemptId
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        runId:
          type: string
        attemptId:
          type: string
        windowId2:
          type: string
          description: 保留位，不使用。
    WritingLeasesRequest:
      type: object
