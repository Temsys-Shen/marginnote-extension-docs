            $ref: '#/components/schemas/TreeNode'
        nextCursor:
          type: [string, "null"]
          description: 下一页的起点。为 `null` 表示已到末尾。
        truncation:
          type: boolean
        walkLimitReached:
          type: boolean
          description: 撞上了遍历硬顶。只有该字段为 `true` 才表示即使读到末页也取不全。
        truncated:
          type: boolean
          description: 该响应不是全部：还有下一页，或撞上了硬顶。
        sort:
          type: string
          description: 只在带 `sort=document` 时出现。
