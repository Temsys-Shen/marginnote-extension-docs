      properties:
        readOnly:
          type: boolean
        scope:
          type: string
        coverage:
          type: string
        state:
          type: string
          description: 没有笔迹时给 `no-stored-ink`。该取值只说明该层没有存下来的笔迹，不等于整道题是空白。
        pngBase64:
          type: string
          description: 预览图。超出大小上限时可能不给。
    LegacySyncStatusResponse:
      type: object
      description: 整机的同步诊断快照。不含笔记正文、文档名、账号与云端记录标识。
      properties:
        cloudKit:
          type: object
          properties:
            errorCount:
              type: number
              description: 本进程保留的历史诊断数。
            suspensionNeedsAttention:
              type: boolean
              description: 状态为暂停时必须看该项。为 `false` 时暂停可能只是正常的增量拉取间歇。
            suspensionErrorCount:
              type: number
              description: 本轮暂停里的错误次数。不要用历史总数代替。
          additionalProperties: true
        documents:
          type: object
          additionalProperties: true
        diagnostic:
          type: object
          additionalProperties: true
    LegacySyncEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        lastSequence:
          type: number
          description: 继续取时用作 `afterSequence`。
        hasMore:
          type: boolean
          description: 为 `true` 表示还有可取的事件。
        historyTruncated:
          type: boolean
          description: 起点已早于本机的滚动记录窗口，或窗口内出现过记录缺口。此时不能声称中间阶段是完整的。
        cursorAdvancedPastGap:
          type: boolean
          description: 缺口之后没有事件可给，MarginNote 把游标推到了当前位置，避免调用方空转。
        cursorAhead:
          type: boolean
          description: 表示调用方的游标与当前资料库或设备不符，游标应当重置。
    BundleEntry:
      type: object
      properties:
        bundleId:
          type: string
        jobId:
          type: string
        bundlePath:
          type: string
          description: 包在磁盘上的位置。
        topicid:
          type: string
        bookmd5:
          type: string
        createdAt:
          type: string
        state:
          type: string
          enum:
            - preparing
            - prepared
            - imported
            - failed
            - cancelled
        version:
          type: number
          description: 已导入的次数，0 表示还没导入。只在已准备与已导入的条目上出现。
        rootNoteId:
          type: string
          description: 导入后生成的根卡。只在已准备与已导入的条目上出现。
        progress:
          type: object
          description: 只在正在准备的条目上出现。
          properties:
            pagesDone:
              type: number
            pagesTotal:
              type: number
        running:
          type: boolean
          description: 只在作业条目上出现。
        error:
          type: string
          description: 失败条目上的原因。
