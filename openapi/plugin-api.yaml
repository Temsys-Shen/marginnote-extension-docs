          type: boolean
          description: 为 `false` 时看 `reason`。该情形不要循环重试。
        reason:
          type: string
        template:
          $ref: '#/components/schemas/ImmersiveTemplateInfo'
        plugins:
          type: array
          description: 模板允许的插件，以及各自的配置。
          items:
            $ref: '#/components/schemas/ImmersivePluginEntry'
        excerptTools:
          $ref: '#/components/schemas/ExcerptTools'
