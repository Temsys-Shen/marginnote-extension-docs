  /status:
    get:
      tags:
        - 能力与状态
      summary: 获取运行状态
      operationId: getStatus
      description: |
        给出 App 名称与版本、契约版本、注册的路由条数、路由目录的校验值，以及运行规程的版本与哈希。

        校验值变化即表示契约变了。把手上的路由清单连同校验值记下来，启动时比对一次，
        即可判断是否需要重新获取 `GET /capabilities`。
      x-mn-source:
        - output/doc/mn-bridge-规程_v0.91_2026-10-06.md:408,423-424
        - output/tools/starter/mn.starter/index.html:159-160
      responses:
        '200':
          description: 版本与校验值。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                recorded:
                  summary: 真机实录（MarginNote 0.61，2026-09-18 录制）
                  value: {
                      "routeCount": 87,
                      "appVersion": "4.5.0",
                      "enabled": true,
                      "app": "MarginNote 4",
                      "instanceNonce": "QqWKCQYQS08cMi3tPkB2fA",
