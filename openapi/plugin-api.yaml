openapi: 3.1.0
info:
  title: 场景插件 API
  summary: 场景插件在网页面板里可以调用的接口。
  description: |
    场景插件的面板是一个网页。页面里向 `/bridge/v1` 发请求，就能读写 MarginNote 里的数据。
    请求由 MarginNote 处理，与外部命令行工具共用同一套处理代码。外部工具要带令牌，面板不必带。
    面板页面从 `mnpanel://panel/index.html` 加载，因此 `fetch('/bridge/v1' + path)` 属于同源请求。

    面板调用受这些条件约束：

    - 请求不带令牌，本文件也不声明安全方案。
    - 页面能调用的接口范围由两道名单共同决定。模板的 `plugins` 名单与当前的沉浸态决定
      面板能否建立，网页面板白名单决定页面能调用的接口。不在白名单里的请求返回 `403`，
      错误码为 `IN_PROCESS_NOT_ALLOWED`。
    - `GET /capabilities` 里的 `requiresMax` 只约束外部 Agent。面板的请求在 MarginNote 进程内处理，
      不受令牌、订阅状态与跨设备批准的限制，接口能否调用只看该接口是否在白名单里。
    - 写操作里的 `addon` 由 MarginNote 改成当前面板所属插件的 id，`confirm` 由 MarginNote 补上。
      页面在这两项上填写的值不被采纳。

    读取数据用 `mn.api(path, opts)`。该方法把响应体一律按 JSON 解析，实现为
    `fetch('/bridge/v1' + path, opts).then(r => r.json())`。

    响应的内容不是 JSON 的接口，改用 `fetch`：

    - `GET /guide` 返回 Markdown 正文。
    - `GET /notes/{noteid}/render` 返回卡片长图或 PDF。
    - `GET /documents/{bookmd5}/pages/{index}/content/{contentId}` 返回图片。
    - `GET /bundles/{bundleId}/files` 带 `?path=` 时返回该文件的原始字节。

    调用失败时 Promise 不会进入 reject。MarginNote 把错误对象
    `{"error":{"code":"…","message":"…"}}` 当作响应体返回，因此结果落在 resolve 里。
    判断调用结果看响应里是否带 `error`，写操作另看响应里的 `persisted`。

    接口清单、各项上限与请求体结构随 MarginNote 的版本变化，运行时的内容由 `GET /capabilities` 与
    `GET /guide` 给出。

    每个接口都带两个自定义字段。`x-mn-source` 列出说明所依据的出处，可以据此核对原文；
    `x-mn-todo` 列出尚未取到的部分。
