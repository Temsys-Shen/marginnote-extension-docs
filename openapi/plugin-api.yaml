            $ref: '#/components/schemas/CommentItem'
        cardAnnotation:
          type: boolean
        annotationVersion:
          type: number
    TreeResponse:
      type: object
      description: |
        整个学习集的脑图。节点是扁平数组，父子关系由每项的 `parent` 写出，没有嵌套的 children。
        翻页时带 `limit` 与 `cursor`；要按文档顺序排列时带 `sort=document`，此时顶层多出 `sort`，
        节点上多出 `docPage` 与 `docBookmd5`。
