                description: 工具的序号，`POST /excerpts` 的 `toolIndex` 取该值。
              label:
                type: string
              hashtag:
                type: string
              aiAddon:
                type: string
                description: 该工具摘下来的卡，其 AI 归的插件。取值是插件的公开 id。
              aiOCR:
                type: boolean
              structuredAIOCR:
                type: boolean
              aiOCRPromptChars:
                type: number
              highlightMode:
                type: number
                description: 高亮样式级别。
              colorIndex:
                type: number
              fillIndex:
                type: number
              insertAfterFocus:
                type: boolean
              addToMap:
                type: boolean
    ImmersiveReview:
      type: object
      properties:
        managedByTemplate:
          type: boolean
