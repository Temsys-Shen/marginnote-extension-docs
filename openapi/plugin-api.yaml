        - 不带 `path` 时的外层键名与条目结构未取到，示例里的 `files` 是占位。
        - 两份内容文件的字段结构未取到。
      x-codeSamples:
        - lang: javascript
          label: 获取任务包里的内容文件
          source: |
            // 该步骤不能用 mn.api，响应不是 JSON
            const res = await fetch('/bridge/v1/bundles/' + bundleId + '/files?path=source.json');
            const src = await res.json();
  /sync/legacy/events:
    get:
      tags:
        - 任务包与同步诊断
      summary: 查询旧同步事件
      operationId: getSyncLegacyEvents
      description: |
        按本设备的序号增量读取同步事件。一次取 1 到 200 条，默认 50 条。

        续读时把上一次响应里的 `lastSequence` 当作 `afterSequence`。`hasMore` 为真表示
        还有可取的事件。

        `historyTruncated` 为真表示起点已早于本机保留的滚动窗口，或者窗口内出现过缺口，
        此时不能声称中间阶段是完整的。尾部没有可返回事件时，MarginNote 会把 `lastSequence` 推到
        当前位置并置 `cursorAdvancedPastGap`，避免调用方空转。`cursorAhead` 为真表示调用方的游标与当前
        资料库或设备不符，游标应当重置。
      x-mn-source:
        - output/doc/mn-bridge-规程_v0.91_2026-10-06.md:462-466
      parameters:
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: 事件列表与游标状态。游标字段有据，事件条目结构未取到。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacySyncEventsResponse'
              examples:
                assembled:
                  summary: 游标字段依据规程正文，事件条目为占位
                  value:
                    events:
                      - sequence: 1841
                        kind: noteChanged
                        at: '2026-10-06T21:12:03Z'
                    lastSequence: 1841
                    hasMore: false
                    historyTruncated: false
                    cursorAdvancedPastGap: false
                    cursorAhead: false
        '403':
          $ref: '#/components/responses/Forbidden'
      x-mn-todo:
        - 事件条目的字段、事件种类的取值表均未取到，示例里的条目是占位。
      x-codeSamples:
        - lang: javascript
          label: 增量轮询旧同步事件
          source: |
            let after = 0;
            for (;;) {
              const r = await mn.api('/sync/legacy/events?afterSequence=' + after + '&limit=50');
              if (r.error) break;
              after = r.lastSequence;
              if (!r.hasMore) break;
            }
  /sync/legacy/status:
    get:
      tags:
        - 任务包与同步诊断
      summary: 获取旧同步状态
      operationId: getSyncLegacyStatus
      description: |
        读整机的旧同步诊断快照。响应里不含笔记正文、文档名、账号与云端记录标识。

        旧同步分两条通道：一条携带学习集结构与学习数据，另一条携带普通原始文档字节。
        两条会先后完成，其中一条完成不证明另一条也完成。

        `cloudKit.errorCount` 是本进程保留的历史诊断数。状态为暂停时要看
        `cloudKit.suspensionNeedsAttention`，该字段为假可以是正常增量拉取的临时暂停，为真才
        表示本轮暂停里出过错。本轮的错误次数读
        `cloudKit.suspensionErrorCount`，不要用历史总数代替。
      x-mn-source:
        - output/doc/mn-bridge-规程_v0.91_2026-10-06.md:455-461
        - capabilities.json 的 legacySync 分组
      responses:
        '200':
          description: 整机的同步诊断快照。云端分组的错误计数与暂停标志有据，其余子字段未取到。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacySyncStatusResponse'
              examples:
                assembled:
                  summary: 云端分组依据规程正文，其余子字段为占位
                  value:
                    cloudKit:
                      state: suspended
                      errorCount: 12
                      suspensionNeedsAttention: true
                      suspensionErrorCount: 3
                    documents:
                      placeholder: true
                    diagnostic:
                      placeholder: true
        '403':
          $ref: '#/components/responses/Forbidden'
      x-mn-todo:
        - "`cloudKit` 除三个错误计数与暂停标志外的子字段未取到。"
        - "`documents` 与 `diagnostic` 两个分组的子字段未取到。"
      x-codeSamples:
        - lang: javascript
          label: 判断暂停是否需要处理
          source: |
            const r = await mn.api('/sync/legacy/status');
            const ck = r.cloudKit || {};
            if (ck.state === 'suspended' && ck.suspensionNeedsAttention) {
              mn.log('本轮暂停里出错 ' + ck.suspensionErrorCount + ' 次');
            }
components:
  parameters:
    Noteid:
      name: noteid
      in: path
      required: true
      description: 卡片的 noteid。取自卡片命令响应的 `noteid`、`POST /notes/batch-get` 响应里 `items[].noteid`，或 `GET /ui-state` 的 `state.focusnoteid`。
      schema:
        type: string
    BlankId:
      name: blankId
      in: path
      required: true
      description: 留白带的身份。取自 `GET /notes/{noteid}/blank-bands` 响应中各项的 `noteid`。
      schema:
        type: string
    Topicid:
      name: topicid
      in: path
      required: true
      description: 学习集的 topicid。取自 `GET /ui-state` 的 `state.topicid`、`GET /library/study-sets`，或 `GET /writing/context` 响应里的 `window.topicid`。
      schema:
        type: string
    Deckid:
      name: deckid
      in: path
      required: true
      description: 复习卡组的 id。取自 `GET /decks`。卡组与学习集是两种对象，id 不通用。
      schema:
        type: string
    Bookmd5:
      name: bookmd5
      in: path
      required: true
      description: 文档的内容标识。取自 `GET /study-sets/{topicid}/documents` 响应里各项的 `bookmd5`、`GET /ui-state` 的 `state.bookmd5`，或 `GET /search?scope=documents`。
      schema:
        type: string
    PageIndex:
      name: index
      in: path
      required: true
      description: PDF 页序，文档第一页为 1。
      schema:
        type: integer
        minimum: 1
    ContentId:
      name: contentId
      in: path
      required: true
      description: 二进制项的身份。取自 `POST /notes/batch-get` 响应 `items[].parts[].contentId`，或 `GET /documents/{bookmd5}/pages/{index}/parts` 响应里的 `contentIds`。
      schema:
        type: string
    CommentIndex:
      name: index
      in: path
      required: true
      description: 批注序号，从 1 起。序号 0 是卡片自身正文，指向该序号的请求返回 `422`。
      schema:
        type: integer
        minimum: 1
    BundleId:
      name: bundleId
      in: path
      required: true
      description: 拆书任务包的身份。取自 `GET /bundles`。
      schema:
        type: string
    Query:
      name: query
      in: query
      required: false
      description: 关键词过滤。
      schema:
        type: string
    Q:
      name: q
      in: query
      required: true
      description: 搜索词。
      schema:
        type: string
    Scope:
      name: scope
      in: query
      required: false
      description: 只取其中一类匹配。
      schema:
        type: string
        enum:
          - all
          - notes
          - studysets
          - documents
        default: all
    PathQuery:
      name: path
      in: query
      required: false
      description: 相对包根或文档根的路径，层级用 `/` 分隔。带该参数时返回一份文件的原始内容，不再返回清单。
      schema:
        type: string
    Depth:
      name: depth
      in: query
      required: false
      description: 向下展开的层数。
      schema:
        type: integer
        minimum: 0
    Origin:
      name: origin
      in: query
      required: false
      description: 只看由 Bridge 建立的任务包。
      schema:
        type: string
        enum:
          - bridge
    Since:
      name: since
      in: query
      required: false
      description: 按时间过滤。磁盘上的任务包按目录创建时间计，作业条目按作业开始时间计。
      schema:
        type: string
    DuplicatesOnly:
      name: duplicatesOnly
      in: query
      required: false
      description: 只返回重复段，不返回逐条摘录。
      schema:
        type: integer
        enum:
          - 1
    StartPage:
      name: start
      in: query
      required: false
      description: 起始页，PDF 页序。
      schema:
        type: integer
        minimum: 1
    EndPage:
      name: end
      in: query
      required: false
      description: 结束页，PDF 页序。单次跨度上限 60 页。
      schema:
        type: integer
        minimum: 1
    Blocks:
      name: blocks
      in: query
      required: false
      description: 切成块返回，每页给出版面检测的块清单。比只取文本慢，建议只取一两页。
      schema:
        type: integer
        enum:
          - 1
    MaxEdge:
      name: maxEdge
      in: query
      required: false
      description: 返回图片的最长边。
      schema:
        type: integer
        minimum: 64
        maximum: 4096
        default: 2048
    VerifyHash:
      name: verifyHash
      in: query
      required: false
      description: 计算内容 hash。默认不算。开启后要扫描整份已实体化的文件，大文档很慢。
      schema:
        type: integer
        enum:
          - 1
    StudySetQuery:
      name: studySet
      in: query
      required: false
      description: 限定某个学习集。在 `GET /documents/{bookmd5}/pages/{index}/parts` 上只调整旧留白映射的解析优先级，不按学习集过滤。
      schema:
        type: string
    SortDocument:
      name: sort
      in: query
      required: false
      description: 按文档顺序排列。排序在分页切片之前对整条序列做，跨页顺序因此是对的。
      schema:
        type: string
        enum:
          - document
    TreeRoot:
      name: root
      in: query
      required: false
      description: 指定子脑图根卡的 noteid，只读其中一张。取自 `GET /study-sets/{topicid}/sub-maps`。
      schema:
        type: string
    TreeLimit:
      name: limit
      in: query
      required: false
      description: 一次返回的节点数上限。
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 5000
    TreeCursor:
      name: cursor
      in: query
      required: false
      description: 下一页的起点，取上一页响应里的 `nextCursor`。
      schema:
        type: string
    WithNotes:
      name: withNotes
      in: query
      required: false
      description: 把每个标签下直接存有该条完整路径的卡片 id 一并给出。
      schema:
        type: integer
        enum:
          - 1
    Prompts:
      name: prompts
      in: query
      required: false
      description: 一并返回提示词全文。默认只给长度。
      schema:
        type: integer
        enum:
          - 1
    RenderFormat:
      name: format
      in: query
      required: false
      description: 长图的格式。
      schema:
        type: string
        enum:
          - png
          - pdf
        default: png
    RenderWidth:
      name: width
      in: query
      required: false
      description: 长图的宽度。像素数超过上限时会被明确拒绝。
      schema:
        type: integer
        minimum: 320
        maximum: 1200
    ContentLayers:
      name: layers
      in: query
      required: false
      description: 取合成图还是只取底层。
      schema:
        type: string
        enum:
          - composite
          - base
        default: composite
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      description: 从该序号之后开始读。取上一页响应里的 `lastSequence`。
      schema:
        type: integer
        minimum: 0
    EventLimit:
      name: limit
      in: query
      required: false
      description: 一次返回的事件条数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Forbidden:
      description: 该接口不在网页面板的白名单上，页面无法调用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notAllowed:
              summary: 不在白名单上
              value:
                error:
                  code: IN_PROCESS_NOT_ALLOWED
                  message: 该接口不在网页面板的白名单上。
    NotFound:
      description: 目标对象不存在，或调用方所在的旧版 MarginNote 没有注册该接口。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              summary: 目标不存在或接口未注册
              value:
                error:
                  code: NOT_FOUND
                  message: 找不到目标对象。
    Conflict:
      description: 读取到写入之间的这段时间里目标被改过，本次调用没有写入任何内容。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            contentChanged:
              summary: 内容已被改过
              value:
                error:
                  code: CONTENT_CHANGED
                  message: 目标内容在这期间被改过，请重读后再发。
    UnprocessableEntity:
      description: 字段合法但组合不成立，例如缺少 `confirm`、序号越界、或写入顺序违反约定。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            confirmRequired:
              summary: 没有带 confirm
              value:
                error:
                  code: CONFIRM_REQUIRED
                  message: 本次调用会改动数据，需要带 confirm。
            invalidOrder:
              summary: 写入顺序不成立
              value:
                error:
                  code: INVALID_ORDER
                  message: deleteComment 必须排在 removeHashtags 之前。
    TooManyRequests:
      description: 扫描名额已经占满。扫描类接口共享两个名额，超出时立即拒绝，不排队。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            scanBusy:
              summary: 扫描名额已满
              value:
                error:
                  code: SCAN_BUSY
                  message: 扫描名额已满，按 details.retryAfterSeconds 等后重发。
                  retryable: true
                  details:
                    retryAfterSeconds: 3
    InternalError:
      description: 落地后重新读取核对不通过，或写入过程报错。响应不等同于成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            saveFailed:
              summary: 写入磁盘后重新读取不一致
              value:
                error:
                  code: SAVE_FAILED
                  message: 写入之后重新读取核对不通过，碰过的卡已整体恢复。
                  retryable: false
    GatewayTimeout:
      description: 扫描迟迟没有结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            scanTimeout:
              summary: 扫描超时
              value:
                error:
                  code: SCAN_TIMEOUT
                  message: 换更小的页范围重发。
                  retryable: true
  schemas:
    ErrorEnvelope:
      type: object
      description: 失败时的响应体。MarginNote 将其当作正常响应体返回，因此落在 resolve 里而不是 reject 里。
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码。判断写入是否发生看该字段，不看 HTTP 状态码。
        message:
          type: string
          description: 人可读的说明。文案随 MarginNote 的版本变化，不要用该字段做分支判断。
        retryable:
          type: boolean
          description: 是否明确可以稍后再来。只有外部 Bridge 的响应带该字段，面板本地路由的响应只有 `code` 与 `message`。该布尔无法表达结果未定，此类情况要按接口的说明处理，例如手写会话族看响应里的 `layerLeaseUnresolved`。
        details:
          type: object
          description: 附加事实。例如 `SCAN_BUSY` 带 `retryAfterSeconds`，`HASHTAG_ROUTE_REQUIRED` 带 `writeRoute`。
          additionalProperties: true
    WriteAck:
      type: object
      description: 写操作响应的公共部分。部分接口另带自己的字段。
      properties:
        persisted:
          type: boolean
          description: 是否已写入。独立重新读取核对一致之后才为 `true`，是判断写入成功的唯一依据。
        noteid:
          type: string
          description: 本次改动的卡片。
        changedCount:
          type: number
          description: 实际改动的对象数。
    NoteEditsRequest:
      type: object
      required:
        - ops
        - confirm
      description: |
        一次提交里对同一张卡做的多步写入。MarginNote 先按顺序模拟整批操作，任何一步不通过，整串都不
        写入；写入之后重新读取核对，不一致就把改动过的卡整体恢复。一批最多 32 步，撤销栈上
        只占一步。
      properties:
        ops:
          type: array
          maxItems: 32
          description: 按顺序执行的步骤。`deleteComment` 必须排在 `removeHashtags` 之前，否则返回 `422 INVALID_ORDER`。
          items:
            $ref: '#/components/schemas/EditOp'
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上，页面不传也生效。
        syncReview:
          type: boolean
          description: 写完之后按摘录时的自动入组规则把该卡补进复习卡组，与本次写入同一步撤销。
    EditOp:
      oneOf:
        - $ref: '#/components/schemas/EditSetTitleOp'
        - $ref: '#/components/schemas/EditAppendCommentOp'
        - $ref: '#/components/schemas/EditDeleteCommentOp'
        - $ref: '#/components/schemas/EditRemoveHashtagsOp'
        - $ref: '#/components/schemas/EditSetAddonValuesOp'
      discriminator:
        propertyName: op
        mapping:
          setTitle: '#/components/schemas/EditSetTitleOp'
          appendComment: '#/components/schemas/EditAppendCommentOp'
          deleteComment: '#/components/schemas/EditDeleteCommentOp'
          removeHashtags: '#/components/schemas/EditRemoveHashtagsOp'
          setAddonValues: '#/components/schemas/EditSetAddonValuesOp'
    EditSetTitleOp:
      type: object
      required:
        - op
        - text
      properties:
        op:
          type: string
          enum:
            - setTitle
        text:
          type: string
          description: 新标题。清空标题传空串。
        expectedPrefix:
          type: string
          description: 当前标题的前 32 个字，为空传空串。这是乐观锁，锁的是读完到写之间这段时间。
    EditAppendCommentOp:
      type: object
      required:
        - op
        - text
      properties:
        op:
          type: string
          enum:
            - appendComment
        text:
          type: string
          description: 追加的批注正文。
    EditDeleteCommentOp:
      type: object
      required:
        - op
        - index
      properties:
        op:
          type: string
          enum:
            - deleteComment
        index:
          type: integer
          minimum: 1
          description: 要删的批注序号，与 `POST /notes/{noteid}/comments` 读到的一致。
        expectedPrefix:
          type: string
          description: 该条批注的前 32 个字。内容已变时返回 `409 COMMENT_CHANGED`。
    EditRemoveHashtagsOp:
      type: object
      required:
        - op
        - hashtags
      properties:
        op:
          type: string
          enum:
            - removeHashtags
        hashtags:
          type: array
          items:
            type: string
          description: 要摘掉的标签，每项写完整路径。
    EditSetAddonValuesOp:
      type: object
      required:
        - op
        - values
      properties:
        op:
          type: string
          enum:
            - setAddonValues
        addon:
          type: string
          description: 插件公开 id。由 MarginNote 改成面板自己的 owner，页面填写的值不被采纳。
        values:
          type: object
          description: 要写入的键值。值为 `null` 表示删掉该键。
          additionalProperties: true
    NoteHashtagsRequest:
      type: object
      required:
        - confirm
      properties:
        noteIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: 目标卡片。批量形态使用 `patches` 时不写该项。
        operation:
          type: string
          enum:
            - add
            - remove
            - replace
          description: 增加、删除或替换。
        hashtags:
          type: array
          maxItems: 100
          items:
            type: string
          description: 标签，每项写一条完整的叶子路径，层级之间用 `/` 分隔。
        includeDescendants:
          type: boolean
          description: 连同下层的标签一起摘掉。只有删除操作接受该参数，其余操作带上会被判非法。
        patches:
          type: array
          description: 批量形态，一次提交多组互不相同的操作。
          items:
            type: object
            required:
              - noteIds
              - operation
              - hashtags
            properties:
              noteIds:
                type: array
                maxItems: 200
                items:
                  type: string
              operation:
                type: string
                enum:
                  - add
                  - remove
                  - replace
              hashtags:
                type: array
                maxItems: 100
                items:
                  type: string
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    NoteMetadataRequest:
      type: object
      required:
        - noteIds
        - patch
        - confirm
      properties:
        noteIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: 目标卡片。
        patch:
          type: object
          description: 要改的样式字段，未写的字段保持原样。
          properties:
            colorIndex:
              type: integer
              minimum: 0
              maximum: 15
              description: 摘录颜色的级别。每一个编号的实际颜色随学习集色板变化，取自 `GET /study-sets/{topicid}/note-palette`，不要将该级别当作固定的颜色名。
            fillIndex:
              type: integer
              enum:
                - -1
                - 0
                - 1
                - 2
              description: 摘录样式的级别。该项管的是来源摘录的样式，不是脑图卡片本身的底色。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    NoteCopyRequest:
      type: object
      required:
        - confirm
      properties:
        noteIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: 要复制的根卡。连同该卡在脑图上的全部下层一起处理。
        targetParentNoteId:
          type: string
          description: 并入的目标卡。
        mode:
          type: string
          enum:
            - reference
            - clone
          description: |
            `reference` 建立与来源保持同步的引用卡，改一处两边一起变。
            `clone` 建立各自独立的卡片，并重写分支内部的链接。
        copies:
          type: array
          description: 一次提交多份，目标或模式可以各不相同。
          items:
            type: object
            properties:
              noteIds:
                type: array
                maxItems: 50
                items:
                  type: string
              targetParentNoteId:
                type: string
              mode:
                type: string
                enum:
                  - reference
                  - clone
        confirm:
          type: boolean
          description: 必填。该接口的 `confirm` 排在业务校验之后，不带时先完成整套只读校验再返回 `422`。
    NoteMoveRequest:
      type: object
      required:
        - confirm
      properties:
        noteIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: 要移动的卡片。一次合计不超过 50 张。
        targetParentNoteId:
          type: string
          description: 新的父卡。
        moves:
          type: array
          description: 批量形态，一次提交多组。
          items:
            type: object
            properties:
              noteIds:
                type: array
                maxItems: 50
                items:
                  type: string
              targetParentNoteId:
                type: string
        confirm:
          type: boolean
          description: 必填。该接口的 `confirm` 排在业务校验之前，不带时只返回该错误码。
    NoteFoldRequest:
      type: object
      required:
        - noteIds
        - folded
        - confirm
      properties:
        noteIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: 目标卡片。
        folded:
          type: boolean
          description: 折叠或展开。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    NoteFocusRequest:
      type: object
      properties:
        topicid:
          type: string
          description: 同一张卡被多个学习集引用时，指定打开的学习集。
    FieldEditRequest:
      type: object
      required:
        - text
        - expectedPrefix
        - confirm
      description: 改写卡片标题或正文。
      properties:
        text:
          type: string
          description: 新内容。清空传空串。
        expectedPrefix:
          type: string
          description: 当前值的前 32 个字，为空传空串。内容已变时返回 `409`。
        markdown:
          type: boolean
          description: 按 Markdown 解析。默认按纯文本处理。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    CommentAddRequest:
      type: object
      required:
        - text
        - confirm
      properties:
        text:
          type: string
          description: 批注正文。整条写成一个 `marginnote4app://note/…` 链接时，该条批注成为真正的双向链接。
        format:
          type: string
          enum:
            - text
            - markdown
            - html
            - rich
          description: 正文的解析方式。改写现成批注时不接受该项。
        style:
          type: object
          description: 只有 `format` 为 `rich` 时生效。MarginNote 移除样式时响应里的 `styled` 为 `false`。
          properties:
            fontName:
              type: string
            fontSize:
              type: number
            textColor:
              type: string
              description: 颜色，写成 `#RRGGBB`。
            backgroundColor:
              type: string
              description: 颜色，写成 `#RRGGBB`。
        field:
          type: string
          description: 标出该条批注所属的字段，便于同一张卡上放多组结构化内容。
        fieldLabel:
          type: boolean
          description: 是否显示字段名。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    CommentEditRequest:
      type: object
      required:
        - text
        - expectedPrefix
        - confirm
      properties:
        text:
          type: string
          description: 新的批注正文。
        expectedPrefix:
          type: string
          description: 该条批注当前内容的前 32 个字。内容已变时返回 `409 COMMENT_CHANGED`。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    CommentDeleteRequest:
      type: object
      required:
        - expectedPrefix
        - confirm
      properties:
        expectedPrefix:
          type: string
          description: 该条批注当前内容的前 32 个字。内容已变时返回 `409 COMMENT_CHANGED`。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    FoldIntoSubMapRequest:
      type: object
      required:
        - confirm
      properties:
        undo:
          type: boolean
          description: 传 `true` 恢复为普通分支。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    MergeBranchRequest:
      type: object
      required:
        - confirm
      properties:
        recursive:
          type: boolean
          description: 连整棵子树一起合并。默认只合并直接子卡。
        confirm:
          type: boolean
          description: 必填。该接口的 `confirm` 排在业务校验之前。
    AddonValuesRequest:
      type: object
      required:
        - noteIds
        - values
        - confirm
      properties:
        addon:
          type: string
          description: 插件公开 id。由 MarginNote 改成面板自己的 owner，页面填写的值不被采纳，写不到别的插件名下。
        noteIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: 目标卡片。
        values:
          type: object
          description: 要写入的键值。值为 `null` 表示删掉该键。一次不超过 50 个键。
          additionalProperties: true
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    ExcerptsRequest:
      type: object
      required:
        - bookmd5
        - page
        - rect
        - confirm
      properties:
        bookmd5:
          type: string
          description: 要摘的文档。
        page:
          type: integer
          minimum: 1
          description: PDF 页序。
        rect:
          $ref: '#/components/schemas/PageRect'
        toolIndex:
          type: integer
          description: 摘录工具的序号。取自 `GET /immersive/template` 响应 `excerptTools.tools[].index`。与 `shortcutIndex` 二者取一。
        shortcutIndex:
          type: integer
          description: 划线快捷项的序号。与 `toolIndex` 二者取一。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    PageRect:
      type: object
      required:
        - x
        - y
        - width
        - height
      description: PDF 页坐标。
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    AnnotationEditorRequest:
      type: object
      required:
        - expectedRevision
        - confirm
      properties:
        expectedRevision:
          type: string
          description: 版本号，用于校验改写。取自 `GET /notes/{noteid}/comments` 或 `POST /notes/batch-get` 响应里的 `commentsRevision`。
        commentId:
          type: string
          description: 继续已有的一份作答纸。不传则新建一份。
        practice:
          type: object
          description: 这道题所属的学习集。
          properties:
            topic:
              type: string
        advance:
          type: string
          enum:
            - next
            - finish
          description: 编辑器上的主按钮。传入即等同于代为按下。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    PracticeVerdictRequest:
      type: object
      required:
        - commentId
        - expectedRevision
        - practice
        - self
        - confirm
      properties:
        commentId:
          type: string
          description: 本次作答纸的身份。
        expectedRevision:
          type: string
          description: 版本号，同 `annotation-editor`。
        practice:
          type: object
          required:
            - topic
          properties:
            topic:
              type: string
              description: 这道题所在的学习集。
        self:
          type: string
          enum:
            - got
            - again
          description: 用户的判定，取值为掌握或仍需练习。
        reason:
          type: string
          description: 错因。可以不传，也可以写成 `null`。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    BlankBandCreateRequest:
      type: object
      required:
        - role
        - confirm
      properties:
        role:
          type: string
          description: 该条带的角色。
        height:
          type: number
          description: 带的高度。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    BlankBandPatchRequest:
      type: object
      required:
        - confirm
      properties:
        closed:
          type: boolean
          description: 折叠或展开。
        height:
          type: number
          minimum: 50
          maximum: 4000
          description: 带的高度。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WindowTopicRequest:
      type: object
      description: 手写会话族里以窗口与学习集为输入的接口共用同一结构。面板两项都可以不填，窗口与身份由 MarginNote 注入，只能读本面板所在的窗口。
      properties:
        windowId:
          type: string
          description: 窗口身份。取自 `GET /writing/windows`。该身份在进程内才有效，不要存下来跨重启使用。
        expectedTopicId:
          type: string
          description: 期望打开的学习集。没有打开学习集时显式传空串。
    WritingContextRequest:
      type: object
      description: 面板可以直接传空对象，窗口与身份由 MarginNote 注入。
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
    WritingContentRequest:
      type: object
