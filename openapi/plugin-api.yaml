      properties:
        carrier:
          type: string
          enum:
            - blank
            - focus
          description: 目标为留白或焦点。
        storageTopicId:
          type: string
          description: 存储所在的学习集。
        physicalBlankId:
          type: string
          description: "`carrier` 为 `blank` 时使用。"
        focusNoteId:
          type: string
          description: "`carrier` 为 `focus` 时使用。"
        layerIds:
          type: array
          maxItems: 32
          items:
            type: string
          description: 要限制的层。不传查全部层，传一个空串查默认层，传空数组或超过 32 个会被拒。
    WritingPencilCommitRequest:
      type: object
      required:
        - requestId
        - target
        - confirm
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        surfaceId:
          type: string
          description: 要保存的画布。取自 `POST /writing/context` 响应里 `surfaces[].surfaceId`。
        requestId:
          type: string
          description: 本次操作的标识，用 UUID。相同的标识配相同的请求只返回原结果，不会重做一次；不同的目标共用同一个标识返回冲突。
        target:
          type: object
          description: 存储身份，要与当前焦点一致。
          properties:
            topicid:
              type: string
            noteid:
              type: string
            layerId:
              type: string
              description: 默认层传空串。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingPencilDocumentCommitRequest:
      type: object
      required:
        - requestId
        - writer
        - target
        - confirm
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        surfaceId:
          type: string
          description: 必须是本窗口的文档面。
        requestId:
          type: string
          description: 同 `pencil-commit`，用 UUID。
        writer:
          type: string
          enum:
            - continuous
            - paged
          description: 连续阅读或翻页。该项不替调用方切换阅读与手写模式。
        target:
          type: object
          description: 从 `POST /writing/context` 该面的 `state.visiblePages[].continuousCommitTarget` 或 `pagedCommitTarget` 原样返回。取到 `null` 表示该路径此刻不可用。
          additionalProperties: true
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingPencilResultRequest:
      type: object
      required:
        - requestId
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        requestId:
          type: string
          description: 与提交时同一个标识。
    WritingPlanSaveRequest:
      type: object
